name: learn-github-actions
run-name: ${{ github.actor }} is learning how to use GitHub Actions
on: [push]
jobs: 
  check-bats-version: 
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout
    - uses: actions/setup-node
      with: 
        node-version: '24'
    - run: npm install -g bats
    - run: bats -v