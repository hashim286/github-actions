name: 'Terraform'

on:
  push:
    branches: [ "main", "test" ]


env: 
    TF_DIRECTORY: ./terraform
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    INSTANCE_NAME: WEB-INSTANCE-${{ github.ref_name }}
    ENVIRONMENT: ${{ github.ref_name }}
    AWS_REGION: us-east-1
    TF_STATE_FILE: terraform-${{ github.ref_name }}
    TEST_ENV: test

permissions:
  contents: read

jobs:
  terraform-create-env:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: main

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_DIRECTORY }}

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v6

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init -backend-config="key=${{ env.TF_STATE_FILE }}.tfstate" -input=false

    - name: Terraform Plan
      run: terraform plan -var='instance_name=${{ env.INSTANCE_NAME }}' -var='environment=${{ env.ENVIRONMENT }}' -var='aws_region=${{ env.AWS_REGION }}' -input=false


      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: github.event_name == 'push'
      run: terraform apply -auto-approve -var='instance_name=${{ env.INSTANCE_NAME }}' -var='environment=${{ env.ENVIRONMENT }}' -var='aws_region=${{ env.AWS_REGION }}' -input=false
  
  terraform-destroy-test-env:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    name: 'Terraform Destroy Test Env'
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_DIRECTORY }}

    steps: 
    - name: Checkout
      uses: actions/checkout@v6

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init -backend-config="key=terraform-${{ env.TEST_ENV }}.tfstate" -input=false

    - name: Cleanup Test Env
      run: terraform destroy -auto-approve -input=false